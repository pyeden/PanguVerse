<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1018">
<title>PanguVerse 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1520'/%3E%3Cpath d='M9 22l7-14 7 14z' fill='none' stroke='%2338bdf8' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M12.5 18h7' stroke='%2338bdf8' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<a class="skip-link" href="#view">跳到主内容</a>

<div class="app" id="appShell" hidden>
  <div class="scrim" id="sidebarScrim" data-act="close-sidebar" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="项目导航">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M7 24L16 6l9 18z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path>
        <path d="M11.5 19h9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
      </svg>
      <span class="brand-text">
        <strong>PanguVerse</strong>
        <small>自动化编排控制台</small>
      </span>
    </div>

    <div class="side-scroll">
      <div class="side-head">
        <span>我的项目</span>
        <button type="button" class="btn btn-icon" data-act="new-project" title="新建项目" aria-label="新建项目">＋</button>
      </div>
      <nav class="project-list" id="projectList" aria-label="项目切换器"></nav>
      <div class="side-empty" id="sideEmpty" hidden>
        <span>还没有项目</span>
        <button type="button" class="link-btn" data-act="new-project">新建第一个项目</button>
      </div>

      <details class="platform-group" id="platformGroup">
        <summary>
          <span class="nav-glyph" aria-hidden="true">▦</span>
          <span>平台</span>
          <span class="chev" aria-hidden="true">▾</span>
        </summary>
        <div class="platform-links">
          <a href="#/platform/atoms" data-nav="atoms">原子库</a>
          <a href="#/platform/packs" data-nav="packs">领域包</a>
          <a href="#/platform/tasks" data-nav="tasks">任务模板</a>
        </div>
      </details>
    </div>

    <div class="sidebar-foot">
      <div class="llm-badge" id="llmBadge" title="规划方式">
        <span class="llm-dot" id="llmDot" aria-hidden="true"></span>
        <span id="llmText">正在读取平台状态…</span>
      </div>
      <dl class="side-facts" id="sideFacts" hidden>
        <div><dt>工作区</dt><dd id="factWorkspace" class="mono">—</dd></div>
        <div><dt>版本</dt><dd id="factVersion" class="mono">—</dd></div>
      </dl>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button type="button" class="menu-btn" data-act="toggle-sidebar" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="topbar-main">
        <div class="crumb" id="crumb">项目</div>
        <nav class="tabs" id="projectTabs" aria-label="项目内导航" hidden></nav>
      </div>
      <div class="topbar-right">
        <span class="conn" id="connState" data-state="pending"><span class="conn-dot" aria-hidden="true"></span><span class="conn-text">连接中…</span></span>
        <span class="whoami" id="whoami" hidden></span>
        <button type="button" class="btn btn-sm btn-ghost" data-act="logout" id="logoutBtn" hidden>退出登录</button>
      </div>
    </header>

    <div class="banner" id="globalBanner" role="alert" hidden></div>

    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>

<div id="bootRoot" class="boot-root">
  <div class="boot-card"><span class="spinner" aria-hidden="true"></span><span>正在验证登录状态…</span></div>
</div>

<div id="loginRoot" class="login-root" hidden></div>

<div id="jobDock" class="job-dock" aria-live="polite" hidden></div>
<div id="modalRoot" class="modal-root" hidden></div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="static/app.js"></script>
</body>
</html>
